# Test the kernels; on main, deploy them to each consumer
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the software Vulkan driver Dawn runs the WGSL on
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers spirv-tools
      - run: npm ci
      - run: make lint
      - run: make
      - run: make test
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: build/

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # One deploy at a time per consumer
    concurrency:
      group: deploy-${{ matrix.repository }}
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          - repository: arbobendik/FlexCudaPT
            key: FLEX_CUDA_PT_DEPLOY_KEY
            source: cuda
            targets: cuda-restir:src/shaders/flexkernels
          - repository: arbobendik/FlexLight
            key: FLEXLIGHT_DEPLOY_KEY
            source: wgsl
            targets: wgsl:src/flexlight/webgpu/shaders/flexkernels glsl:src/flexlight/webgl2/shaders/flexkernels
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history, for the replay
      # Deploy keys, so the consumers' workflows run
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          ref: main
          ssh-key: ${{ secrets[matrix.key] }}
          path: consumer
      - name: Install the CUDA compiler and headers and Vulkan's, as flex-cuda-pt builds
        if: matrix.source == 'cuda'
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cuda-nvcc-13-4 xxd libvulkan-dev
      - uses: actions/setup-node@v7
        if: matrix.source == 'wgsl'
        with:
          node-version: 24
      - name: Install the bundler and compiler, as FlexLight builds
        if: matrix.source == 'wgsl'
        run: npm install -g esbuild typescript
      - run: ci/deploy.sh consumer ${{ matrix.targets }}
        env:  # libcuda comes with the GPU driver, which runners lack
          CUDA_PATH: /usr/local/cuda-13.4
          NVCC: /usr/local/cuda-13.4/bin/nvcc
          LDLIBS: -L/usr/local/cuda-13.4/lib64/stubs
