# Generates the kernels and tests each target against the goldens of its consumer on pushes to main and on pull
# requests; every push to main also commits them to the main of each consumer, one commit for each FlexKernels commit
# that changes its kernels, built with them first, whose own workflows then release the extension and deploy the website.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the software Vulkan driver Dawn runs the WGSL on
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - run: npm ci
      - run: make lint
      - run: make
      - run: make test
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: build/

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # One deploy at a time, none cancelled: each passes on the commits since the consumer's last
    concurrency:
      group: deploy
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          - repository: arbobendik/FlexCudaPT
            key: FLEX_CUDA_PT_DEPLOY_KEY
            source: cuda
            vendored: src/shaders/flexkernels
          - repository: arbobendik/FlexLight
            key: FLEXLIGHT_DEPLOY_KEY
            source: wgsl
            vendored: src/flexlight/webgpu/shaders/flexkernels
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # For the commits passed on, each generated anew
      # Pushes through a deploy key run the consumer's workflows, those with the default token would not
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          ref: main
          ssh-key: ${{ secrets[matrix.key] }}
          path: consumer
      - name: Install the CUDA compiler and headers and Vulkan's, as flex-cuda-pt builds
        if: matrix.source == 'cuda'
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cuda-nvcc-13-4 xxd libvulkan-dev
      - uses: actions/setup-node@v7
        if: matrix.source == 'wgsl'
        with:
          node-version: 24
      - name: Install the bundler and compiler, as FlexLight builds
        if: matrix.source == 'wgsl'
        run: npm install -g esbuild typescript
      - run: ci/deploy.sh consumer ${{ matrix.source }} ${{ matrix.vendored }}
        env:  # flex-cuda-pt's, libcuda itself comes with the GPU driver, which runners lack
          CUDA_PATH: /usr/local/cuda-13.4
          NVCC: /usr/local/cuda-13.4/bin/nvcc
          LDLIBS: -L/usr/local/cuda-13.4/lib64/stubs
