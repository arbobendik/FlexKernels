# Generates the kernels and tests them against the goldens of the CUDA BSDF on pushes to main and on pull requests; every
# push to main also opens or updates a pull request with them in each consumer, whose merge deploys it as before.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the software Vulkan driver Dawn runs the WGSL on
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - run: npm ci
      - run: make
      - run: make test
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: build/

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - repository: arbobendik/FlexCudaPT
            source: cuda
            vendored: src/shaders/flexkernels
          - repository: arbobendik/FlexLight
            source: wgsl
            vendored: src/flexlight/webgpu/shaders/flexkernels
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: build
          path: build
      # Pull requests opened with the default token would not run the consumer's CI
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          token: ${{ secrets.FLEXKERNELS_DEPLOY_TOKEN }}
          path: consumer
      - working-directory: consumer
        env:
          GH_TOKEN: ${{ secrets.FLEXKERNELS_DEPLOY_TOKEN }}
        run: |
          title="chore(flexkernels): update kernels to ${GITHUB_SHA::7}"
          git config user.name "Bendik Arbogast"
          git config user.email "arbobendik@gmail.com"
          git switch -C flexkernels/update
          rm -rf ${{ matrix.vendored }}
          mkdir -p ${{ matrix.vendored }}
          cp ../build/${{ matrix.source }}/* ${{ matrix.vendored }}
          echo "$GITHUB_SHA" > ${{ matrix.vendored }}/VERSION
          git add ${{ matrix.vendored }}
          git commit -m "$title"
          git push --force origin flexkernels/update
          if gh pr view flexkernels/update --json state -q .state | grep -q OPEN; then
            gh pr edit flexkernels/update --title "$title"
          else
            gh pr create --base main --head flexkernels/update --title "$title" \
              --body "Kernels generated by $GITHUB_REPOSITORY@$GITHUB_SHA."
          fi
